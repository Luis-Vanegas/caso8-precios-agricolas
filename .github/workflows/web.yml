# Publica la web (carpeta web/) en GitHub Pages cada vez que cambia en main.
# Requiere activar Pages una vez: Settings > Pages > Source: "GitHub Actions".
name: Publicar la web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # En Pages el sitio vive en /caso8-precios-agricolas: la web necesita saberlo.
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
